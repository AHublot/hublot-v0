# Si ton projet « flotte » passe par Traefik : ajoute ces lignes au service hublot de docker-compose.yml,
# retire le bloc « ports », et branche-le sur le réseau de Traefik (remplace « web » par le nom du tien).
    labels:
      - traefik.enable=true
      - traefik.http.routers.hublot.rule=Host(`hublot.lemard.fr`)
      - traefik.http.routers.hublot.entrypoints=websecure
      - traefik.http.routers.hublot.tls.certresolver=letsencrypt
      - traefik.http.services.hublot.loadbalancer.server.port=8080
    networks:
      - web
networks:
  web:
    external: true
