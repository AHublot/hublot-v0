# /etc/nginx/sites-available/capdepart  (puis : ln -s ../sites-available/capdepart /etc/nginx/sites-enabled/)
# Remplace capdepart.tondomaine.fr, puis : sudo nginx -t && sudo systemctl reload nginx
# HTTPS : sudo certbot --nginx -d capdepart.tondomaine.fr
server {
    listen 80;
    server_name capdepart.tondomaine.fr;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
